name: Integration Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer run of the same workflow on the same branch cancels the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # failsafe:verify is what makes the job fail when an integration test fails; with only the
      # integration-test phase (mvn integration-test), failures were recorded but not reported. The
      # unit tests and the static analysis run in their own workflows.
      - name: Run integration tests
        run: mvn -B -ntp test-compile failsafe:integration-test failsafe:verify

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-reports
          path: target/failsafe-reports/
          retention-days: 7
