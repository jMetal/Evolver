# Logging of the tests (surefire and failsafe load it with java.util.logging.config.file, see the
# pom): only warnings and errors. At INFO, jMetal logs every observer it registers and every
# evaluation it observes, which buried the build output under thousands of lines.
handlers = java.util.logging.ConsoleHandler
.level = WARNING
java.util.logging.ConsoleHandler.level = WARNING
java.util.logging.SimpleFormatter.format = %4$s: %5$s%6$s%n
