# Test fixture: NSGAIIDouble.yaml with ranges wider than the operators accept (offspringPopulationSize
# 0, a tournament up to 500, probabilities outside [0, 1], an archive of 1), to check that the
# errors of an invalid configuration name the parameter that causes them.
algorithmResult:
  type: categorical
  values: 
    population: {}
    externalArchive:
      conditionalParameters:
        populationSizeWithArchive:
          type: integer
          range: [1, 5000]
        archiveType:
          type: categorical
          values:
            # crowdingDistanceArchive kept available: loses resolution on 3+ objective
            # problems, but is still useful for bi-objective problems.
            crowdingDistanceArchive: {}
            unboundedArchive: {}
            spatialSpreadDeviationArchive: {}
            knnDistanceArchive:
              conditionalParameters:
                knnDistanceArchiveK:
                  type: integer
                  range: [1, 10]
            angleArchive: {}

createInitialSolutions:
  type: categorical
  values:
    default: {}
    latinHypercubeSampling: {}
    scatterSearch: {}
    sobol: {}
    cauchy: {}
    oppositionBased: {}

offspringPopulationSize:
  type: categorical
  values: [0, 1, 100]

variation:
  type: categorical
  values:
    crossoverAndMutationVariation:
      conditionalParameters:
        crossover:
          type: categorical
          globalSubParameters:
            crossoverProbability:
              type: double
              range: [-1.0, 2.0]
            crossoverRepairStrategy:
              type: categorical
              values: [random, round, bounds]
          values:
            SBX:
              conditionalParameters:
                sbxDistributionIndex:
                  type: double
                  range: [0.0, 400.0]
            blxAlpha:
              conditionalParameters:
                blxAlphaCrossoverAlpha:
                  type: double
                  range: [0.0, 1.0]
            wholeArithmetic: {}
            blxAlphaBeta:
              conditionalParameters:
                blxAlphaBetaCrossoverBeta:
                  type: double
                  range: [0.0, 1.0]
                blxAlphaBetaCrossoverAlpha:
                  type: double
                  range: [0.0, 1.0]
            arithmetic: {}
            laplace:
              conditionalParameters:
                laplaceCrossoverScale:
                  type: double
                  range: [0.1, 0.5]
            fuzzyRecombination:
              conditionalParameters:
                fuzzyRecombinationCrossoverAlpha:
                  type: double
                  range: [0.0001, 1.0]
            PCX:
              conditionalParameters:
                pcxCrossoverZeta:
                  type: double
                  range: [0.0, 1.0]
                pcxCrossoverEta:
                  type: double
                  range: [0.0, 1.0]
            UNDC:
              conditionalParameters:
                undcCrossoverZeta:
                  type: double
                  range: [0.1, 1.0]
                undcCrossoverEta:
                  type: double
                  range: [0.1, 0.5]
            SDX:
              conditionalParameters:
                sdxCrossoverF:
                  type: double
                  range: [0.0, 1.0]

        mutation:
          type: categorical
          globalSubParameters:
            mutationProbabilityFactor:
              type: double
              range: [0.0, 50.0]
            mutationRepairStrategy:
              type: categorical
              values:
                random: {}
                round: {}
                bounds: {}
          values:
            uniform:
              conditionalParameters:
                uniformMutationPerturbation:
                  type: double
                  range: [0.0, 1.0]
            polynomial:
              conditionalParameters:
                polynomialMutationDistributionIndex:
                  type: double
                  range: [5.0, 400.0]
            linkedPolynomial:
              conditionalParameters:
                linkedPolynomialMutationDistributionIndex:
                  type: double
                  range: [5.0, 400.0]
            nonUniform:
              conditionalParameters:
                nonUniformMutationPerturbation:
                  type: double
                  range: [0.0, 1.0]
            levyFlight:
              conditionalParameters:
                levyFlightMutationBeta:
                  type: double
                  range: [1.0001, 2.0]
                levyFlightMutationStepSize:
                  type: double
                  range: [0.01, 1.0]
            powerLaw:
              conditionalParameters:
                powerLawMutationDelta:
                  type: double
                  range: [0.1, 10.0]

selection:
  type: categorical
  values:
    tournament:
      conditionalParameters:
        selectionTournamentSize:
          type: integer
          range: [1, 500]
    random: {}
    boltzmann:
      conditionalParameters:
        boltzmannTemperature:
          type: double
          range: [0.1, 100.0]
    ranking: {}
    stochasticUniversalSampling: {}
