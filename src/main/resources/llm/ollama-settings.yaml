# Settings of a language model served by Ollama on this computer (tutorial E21,
# docs/tutorials/llms_in_evolver.rst). think: false turns the reasoning of the model off, which
# makes each call much faster; keep_alive keeps the model in memory between calls.
provider: ollama
baseUrl: http://localhost:11434
model: qwen3.5:35b-mlx
temperature: 0.7
timeoutSeconds: 300
options:
  think: false
  keep_alive: 30m
