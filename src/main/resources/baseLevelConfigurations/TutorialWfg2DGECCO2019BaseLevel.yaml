# Base level of tutorial E6 (docs/tutorials/designing_parameter_spaces.rst): NSGA-II tuned for the
# bi-objective WFG problems, as in Nebro et al., "Automatic Configuration of NSGA-II with jMetal and
# irace" (GECCO 2019 Companion), in the parameter space of that paper (NSGAIIDoubleGECCO2019.yaml)
# instead of NSGAIIDouble.yaml. Everything else is as in tutorial E9 (TutorialWfg2DBaseLevel.yaml).
algorithmName: NSGA-II
populationSize: 100
numberOfIndependentRuns: 1
yamlParameterSpaceFile: NSGAIIDoubleGECCO2019.yaml
trainingProblemNames: [WFG1, WFG2, WFG3, WFG4, WFG5, WFG6, WFG7, WFG8, WFG9]
trainingReferenceFrontFileNames:
  - resources/referenceFronts/WFG1.2D.csv
  - resources/referenceFronts/WFG2.2D.csv
  - resources/referenceFronts/WFG3.2D.csv
  - resources/referenceFronts/WFG4.2D.csv
  - resources/referenceFronts/WFG5.2D.csv
  - resources/referenceFronts/WFG6.2D.csv
  - resources/referenceFronts/WFG7.2D.csv
  - resources/referenceFronts/WFG8.2D.csv
  - resources/referenceFronts/WFG9.2D.csv
trainingEvaluations: [10000, 10000, 10000, 10000, 10000, 10000, 10000, 10000, 10000]
indicatorNames: [Epsilon, NormalizedHypervolume]
