# Base level of tutorial E10 (docs/tutorials/binary_and_permutation_encodings.rst): NSGA-II for
# permutation problems (PermutationNSGAII, NSGAIIPermutation.yaml), tuned for two bi-objective TSP
# instances of 100 cities (KroAB100TSP and KroAC100TSP). They have no
# reference front: each file of resources/referenceFrontsTSP/ holds only two extreme points that
# bound the objectives, enough for HV- (tutorial E9), the main objective. EP is a helper objective:
# against two points its values have no meaning of their own, but they tell apart the configurations
# whose fronts have no hypervolume. Each run has 25000 evaluations, 20% of the 125000 of the
# validation, and each configuration is run three times.
algorithmName: NSGA-II
encoding: Permutation
populationSize: 100
numberOfIndependentRuns: 3
yamlParameterSpaceFile: NSGAIIPermutation.yaml
trainingProblemNames:
  - KroAB100TSP
  - KroAC100TSP
trainingReferenceFrontFileNames:
  - resources/referenceFrontsTSP/KroAB100TSP.csv
  - resources/referenceFrontsTSP/KroAC100TSP.csv
trainingEvaluations: [25000, 25000]
indicatorNames: [HypervolumeMinus, Epsilon]
