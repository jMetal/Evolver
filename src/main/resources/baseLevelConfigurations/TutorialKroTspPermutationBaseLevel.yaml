# Base level of tutorial E11 (docs/tutorials/binary_and_permutation_encodings.rst): NSGA-II for
# permutation problems (PermutationNSGAII, NSGAIIPermutation.yaml), tuned for two bi-objective TSP
# instances of 100 cities (KroAB100 and KroAC100), named by their jMetal classes. They have no
# reference front: each file of resources/referenceFrontsTSP/ holds two extreme points that bound
# the objectives, used with HV- (tutorial E10). Each run has 25000 evaluations, 20% of the 125000 of
# the validation, and each configuration is run three times.
algorithmName: NSGA-II
encoding: Permutation
populationSize: 100
numberOfIndependentRuns: 3
yamlParameterSpaceFile: NSGAIIPermutation.yaml
trainingProblemNames:
  - org.uma.jmetal.problem.multiobjective.multiobjectivetsp.instance.KroAB100TSP
  - org.uma.jmetal.problem.multiobjective.multiobjectivetsp.instance.KroAC100TSP
trainingReferenceFrontFileNames:
  - resources/referenceFrontsTSP/KroAB100TSP.csv
  - resources/referenceFrontsTSP/KroAC100TSP.csv
trainingEvaluations: [25000, 25000]
indicatorNames: [HypervolumeMinus, Epsilon]
