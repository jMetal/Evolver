# Parameter space of NSGA-II in Nebro et al., "Automatic Configuration of NSGA-II with jMetal and
# irace" (GECCO 2019 Companion), Figure 4, written for Evolver (tutorial E5). Differences with the
# paper: the population size without an archive is not a parameter (it is the populationSize of
# the algorithm), the archive is always bounded by crowding distance (the paper's only archive),
# and the mutation probability is given as mutationProbabilityFactor / number of variables, in
# [0, 2], instead of an absolute probability in [0, 1].
algorithmResult:
  type: categorical
  values:
    population: {}
    externalArchive:
      conditionalParameters:
        populationSizeWithArchive:
          type: categorical
          values: [10, 20, 50, 100, 200, 400]
        archiveType:
          type: categorical
          values: [crowdingDistanceArchive]

createInitialSolutions:
  type: categorical
  values: [default, latinHypercubeSampling, scatterSearch]

offspringPopulationSize:
  type: categorical
  values: [1, 5, 10, 20, 50, 100, 200, 400]

variation:
  type: categorical
  values:
    crossoverAndMutationVariation:
      conditionalParameters:
        crossover:
          type: categorical
          globalSubParameters:
            crossoverProbability:
              type: double
              range: [0.0, 1.0]
            crossoverRepairStrategy:
              type: categorical
              values: [random, round, bounds]
          values:
            SBX:
              conditionalParameters:
                sbxDistributionIndex:
                  type: double
                  range: [5.0, 400.0]
            blxAlpha:
              conditionalParameters:
                blxAlphaCrossoverAlpha:
                  type: double
                  range: [0.0, 1.0]
        mutation:
          type: categorical
          globalSubParameters:
            mutationProbabilityFactor:
              type: double
              range: [0.0, 2.0]
            mutationRepairStrategy:
              type: categorical
              values: [random, round, bounds]
          values:
            uniform:
              conditionalParameters:
                uniformMutationPerturbation:
                  type: double
                  range: [0.0, 1.0]
            polynomial:
              conditionalParameters:
                polynomialMutationDistributionIndex:
                  type: double
                  range: [5.0, 400.0]

selection:
  type: categorical
  values:
    tournament:
      conditionalParameters:
        selectionTournamentSize:
          type: integer
          range: [2, 10]
    random: {}
