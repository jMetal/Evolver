# Parameter space for the meta-level SPEA2 with the flat [0,1]^n encoding, used by cli.training's
# MetaAlgorithmRegistry and by org.uma.evolver.meta.builder.MetaSPEA2Builder. SPEA2 is expressed as
# a DoubleRDEMOEA configuration: what defines it, strength ranking and the k-nearest-neighbour density
# estimator (with its sequential replacement), has a single value here, and the registry fixes it;
# the variation and the selection are those of NSGAIIMetaDouble.yaml, set in the meta-optimizer
# configuration file as for NSGA-II (the registry gives them SPEA2's usual values when they are
# absent: SBX, polynomial mutation, binary tournament), and so are knnNeighborhoodSize (1 by
# default) and knnNormalizeObjectives (false by default).
#
# A meta-optimizer never uses an external archive (algorithmResult is always population), and its
# offspring population size always equals its population size, so that each generation's offspring
# is evaluated in parallel as a whole. offspringPopulationSize is declared as an integer range
# (rather than RDEMOEADouble.yaml's categorical list) only so that any meta population size is
# accepted.

algorithmResult:
  type: categorical
  values:
    population: {}

createInitialSolutions:
  type: categorical
  values:
    default: {}

offspringPopulationSize:
  type: integer
  range: [1, 100000]

densityEstimator:
  type: categorical
  values:
    knn:
      conditionalParameters:
        knnNeighborhoodSize:
          type: integer
          range: [1, 5]
        knnNormalizeObjectives:
          type: categorical
          values:
            "true":
            "false":

ranking:
  type: categorical
  values:
    strengthRanking:

variation:
  type: categorical
  values:
    crossoverAndMutationVariation:
      conditionalParameters:
        crossover:
          type: categorical
          globalSubParameters:
            crossoverProbability:
              type: double
              range: [0.0, 1.0]
            crossoverRepairStrategy:
              type: categorical
              values: [random, round, bounds]
          values:
            SBX:
              conditionalParameters:
                sbxDistributionIndex:
                  type: double
                  range: [5.0, 400.0]
            blxAlpha:
              conditionalParameters:
                blxAlphaCrossoverAlpha:
                  type: double
                  range: [0.0, 1.0]
            wholeArithmetic: {}

        mutation:
          type: categorical
          globalSubParameters:
            mutationProbabilityFactor:
              type: double
              range: [0.0, 2.0]
            mutationRepairStrategy:
              type: categorical
              values:
                random: {}
                round: {}
                bounds: {}
          values:
            uniform:
              conditionalParameters:
                uniformMutationPerturbation:
                  type: double
                  range: [0.0, 1.0]
            polynomial:
              conditionalParameters:
                polynomialMutationDistributionIndex:
                  type: double
                  range: [5.0, 400.0]

selection:
  type: categorical
  values:
    tournament:
      conditionalParameters:
        selectionTournamentSize:
          type: integer
          range: [2, 10]

replacement:
  type: categorical
  values:
    rankingAndDensityEstimator:
      conditionalParameters:
        removalPolicy:
          type: categorical
          values:
            sequential:
