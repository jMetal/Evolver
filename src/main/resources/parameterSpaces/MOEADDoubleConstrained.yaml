# MOEADDouble.yaml plus the subproblem update criterion, for problems with constraints: MOEA/D does
# not rank its population, so it handles constraints where a new solution competes with the
# solution of a subproblem, with the criterion of jMetal that this parameter selects (Deb's
# feasibility rules, the improved epsilon method of Fan et al., 2019, or the adaptive violation
# threshold). The criterion that ignores the constraints (comparing the aggregation values alone) is
# not offered; the three are that comparison on problems without constraints. The improved epsilon
# sub-parameters are scale-free, so that they can transfer between problems; its defaults in Fan et
# al. (2019) are tao 0.1, threshold 0.95 and decay 0.8.
subproblemUpdateCriterion:
  type: categorical
  values:
    feasibilityRules: {}
    improvedEpsilon:
      conditionalParameters:
        improvedEpsilonTao:
          type: double
          range: [0.01, 0.5]
        improvedEpsilonFeasibilityRatioThreshold:
          type: double
          range: [0.5, 1.0]
        improvedEpsilonDecayFraction:
          type: double
          range: [0.1, 0.95]
    violationThreshold: {}

neighborhoodSize:
  type: integer
  range: [5, 50]
#
maximumNumberOfReplacedSolutions:
  type: integer
  range: [1, 5]
#
aggregationFunction:
  type: categorical
  globalSubParameters:
    normalizeObjectives:
      type: categorical
      values:
        "true":
          conditionalParameters:
            epsilonParameterForNormalization:
              type: double
              range: [1.0E-8, 25.0]
        "false":
  values:
    tschebyscheff:
    weightedSum:
    penaltyBoundaryIntersection:
      conditionalParameters:
        pbiTheta:
          type: double
          range: [1.0, 200.0]
    modifiedTschebyscheff:
    augmentedTschebyscheff:
    invertedPenaltyBoundaryIntersection:
      conditionalParameters:
        ipbiTheta:
          type: double
          range: [0.01, 200.0]
#
algorithmResult:
  type: categorical
  values:
    externalArchive:
      conditionalParameters:
        archiveType:
          type: categorical
          values:
#            crowdingDistanceArchive: — disabled: not competitive on 3+ objective problems (crowding distance loses resolution)
            unboundedArchive:
            spatialSpreadDeviationArchive:
            knnDistanceArchive:
              conditionalParameters:
                knnDistanceArchiveK:
                  type: integer
                  range: [1, 10]
            angleArchive:
    population:
#
subProblemIdGenerator:
  type: categorical
  values:
    randomPermutationCycle:
    cyclicIntegerSequence:
#
createInitialSolutions:
  type: categorical
  values:
    default:
    latinHypercubeSampling:
    scatterSearch:
    sobol:
    cauchy:
    oppositionBased:
#
variation:
  type: categorical
  globalSubParameters:
    mutation:
      type: categorical
      globalSubParameters:
        mutationProbabilityFactor:
          type: double
          range: [0.0, 2.0]
        mutationRepairStrategy:
          type: categorical
          values:
            random:
            round:
            bounds:
      values:
        uniform:
          conditionalParameters:
            uniformMutationPerturbation:
              type: double
              range: [0.0, 1.0]
        polynomial:
          conditionalParameters:
            polynomialMutationDistributionIndex:
              type: double
              range: [5.0, 400.0]
        linkedPolynomial:
          conditionalParameters:
            linkedPolynomialMutationDistributionIndex:
              type: double
              range: [5.0, 400.0]
        nonUniform:
          conditionalParameters:
            nonUniformMutationPerturbation:
              type: double
              range: [0.0, 1.0]
        levyFlight:
          conditionalParameters:
            levyFlightMutationBeta:
              type: double
              range: [1.0001, 2.0]
            levyFlightMutationStepSize:
              type: double
              range: [0.01, 1.0]
        powerLaw:
          conditionalParameters:
            powerLawMutationDelta:
              type: double
              range: [0.1, 10.0]

        
  values:
    crossoverAndMutationVariation:
      conditionalParameters:
        crossover:
          type: categorical
          globalSubParameters:
            crossoverProbability:
              type: double
              range: [0.0, 1.0]
            crossoverRepairStrategy:
              type: categorical
              values:
                random:
                round:
                bounds:
          values:
            SBX:
              conditionalParameters:
                sbxDistributionIndex:
                  type: double
                  range: [5.0, 400.0]
            blxAlpha:
              conditionalParameters:
                blxAlphaCrossoverAlpha:
                  type: double
                  range: [0.0, 1.0]
            wholeArithmetic: {}
            blxAlphaBeta:
              conditionalParameters:
                blxAlphaBetaCrossoverBeta:
                  type: double
                  range: [0.0, 1.0]
                blxAlphaBetaCrossoverAlpha:
                  type: double
                  range: [0.0, 1.0]
            arithmetic: {}
            laplace:
              conditionalParameters:
                laplaceCrossoverScale:
                  type: double
                  range: [0.1, 0.5]
            fuzzyRecombination:
              conditionalParameters:
                fuzzyRecombinationCrossoverAlpha:
                  type: double
                  range: [0.0001, 1.0]
            PCX:
              conditionalParameters:
                pcxCrossoverZeta:
                  type: double
                  range: [0.0, 1.0]
                pcxCrossoverEta:
                  type: double
                  range: [0.0, 1.0]
            UNDC:
              conditionalParameters:
                undcCrossoverZeta:
                  type: double
                  range: [0.1, 1.0]
                undcCrossoverEta:
                  type: double
                  range: [0.1, 0.5]
                  
    differentialEvolutionVariation:
      conditionalParameters:
        differentialEvolutionCrossover:
          type: categorical
          globalSubParameters:
            CR:
              type: double
              range: [0.0, 1.0]
            F:
              type: double
              range: [0.0, 1.0]
          values:
            RAND_1_BIN:
            RAND_1_EXP:
            RAND_2_BIN:
            RAND_2_EXP:
#
selection:
  type: categorical
  values:
    populationAndNeighborhoodMatingPoolSelection:
      conditionalParameters:
        neighborhoodSelectionProbability:
          type: double
          range: [0.0, 1.0]