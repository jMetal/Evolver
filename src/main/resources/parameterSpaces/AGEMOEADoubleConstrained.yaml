# AGEMOEADouble.yaml plus the constraint-handling technique, for problems with constraints, as in
# NSGAIIDoubleConstrained.yaml: with this space, AGE-MOEA (BaseAGEMOEA) handles the constraints with
# the technique it selects. The sub-parameters are scale-free, so that they can transfer between
# problems.
constraintHandling:
  type: categorical
  values:
    cdp: {}
    violatedConstraints: {}
    epsilonConstrained:
      conditionalParameters:
        epsilonInitialQuantile:
          type: double
          range: [0.05, 0.95]
        epsilonExponent:
          type: double
          range: [1.0, 10.0]
        epsilonDecayFraction:
          type: double
          range: [0.1, 0.95]
    stochasticRanking:
      conditionalParameters:
        stochasticRankingProbability:
          type: double
          range: [0.0, 0.5]
    pushPull:
      conditionalParameters:
        pushPullChangeThreshold:
          type: double
          range: [0.0001, 0.05]
        pushPullWindowFraction:
          type: double
          range: [0.01, 0.1]
        pushPullDecayFraction:
          type: double
          range: [0.1, 0.95]
        pushPullExponent:
          type: double
          range: [1.0, 10.0]
        pushPullFeasibilityThreshold:
          type: double
          range: [0.5, 1.0]
        pushPullReductionRate:
          type: double
          range: [0.01, 0.5]
    selfAdaptivePenalty: {}

# The variant of the AGE-MOEA family, as the replacement of RVEADouble.yaml: AGE-MOEA or
# AGE-MOEA-II (their environmental selections differ in how they estimate the geometry of the front).
replacement:
  type: categorical
  values:
    agemoea: {}
    agemoeaII: {}

algorithmResult:
  type: categorical
  values:
    population: {}
    externalArchive:
      conditionalParameters:
        populationSizeWithArchive:
          type: integer
          range: [10, 200]
        archiveType:
          type: categorical
          values:
            crowdingDistanceArchive: {}
            unboundedArchive: {}

createInitialSolutions:
  type: categorical
  values:
    default: {}
    latinHypercubeSampling: {}
    scatterSearch: {}
    sobol: {}
    cauchy: {}
    oppositionBased: {}

offspringPopulationSize:
  type: categorical
  values: [1, 5, 10, 20, 50, 100, 200, 400]

variation:
  type: categorical
  values:
    crossoverAndMutationVariation:
      conditionalParameters:
        crossover:
          type: categorical
          globalSubParameters:
            crossoverProbability:
              type: double
              range: [0.0, 1.0]
            crossoverRepairStrategy:
              type: categorical
              values: [random, round, bounds]
          values:
            SBX:
              conditionalParameters:
                sbxDistributionIndex:
                  type: double
                  range: [5.0, 400.0]
            blxAlpha:
              conditionalParameters:
                blxAlphaCrossoverAlpha:
                  type: double
                  range: [0.0, 1.0]
            wholeArithmetic: {}
            blxAlphaBeta:
              conditionalParameters:
                blxAlphaBetaCrossoverBeta:
                  type: double
                  range: [0.0, 1.0]
                blxAlphaBetaCrossoverAlpha:
                  type: double
                  range: [0.0, 1.0]
            arithmetic: {}
            laplace:
              conditionalParameters:
                laplaceCrossoverScale:
                  type: double
                  range: [0.1, 0.5]
            fuzzyRecombination:
              conditionalParameters:
                fuzzyRecombinationCrossoverAlpha:
                  type: double
                  range: [0.0001, 1.0]
            PCX:
              conditionalParameters:
                pcxCrossoverZeta:
                  type: double
                  range: [0.0, 1.0]
                pcxCrossoverEta:
                  type: double
                  range: [0.0, 1.0]
            UNDC:
              conditionalParameters:
                undcCrossoverZeta:
                  type: double
                  range: [0.1, 1.0]
                undcCrossoverEta:
                  type: double
                  range: [0.1, 0.5]

        mutation:
          type: categorical
          globalSubParameters:
            mutationProbabilityFactor:
              type: double
              range: [0.0, 2.0]
            mutationRepairStrategy:
              type: categorical
              values:
                random: {}
                round: {}
                bounds: {}
          values:
            uniform:
              conditionalParameters:
                uniformMutationPerturbation:
                  type: double
                  range: [0.0, 1.0]
            polynomial:
              conditionalParameters:
                polynomialMutationDistributionIndex:
                  type: double
                  range: [5.0, 400.0]
            linkedPolynomial:
              conditionalParameters:
                linkedPolynomialMutationDistributionIndex:
                  type: double
                  range: [5.0, 400.0]
            nonUniform:
              conditionalParameters:
                nonUniformMutationPerturbation:
                  type: double
                  range: [0.0, 1.0]
            levyFlight:
              conditionalParameters:
                levyFlightMutationBeta:
                  type: double
                  range: [1.0001, 2.0]
                levyFlightMutationStepSize:
                  type: double
                  range: [0.01, 1.0]
            powerLaw:
              conditionalParameters:
                powerLawMutationDelta:
                  type: double
                  range: [0.1, 10.0]

selection:
  type: categorical
  values:
    tournament:
      conditionalParameters:
        selectionTournamentSize:
          type: integer
          range: [2, 10]
    random: {}
    boltzmann:
      conditionalParameters:
        boltzmannTemperature:
          type: double
          range: [0.1, 100.0]
    ranking: {}
    stochasticUniversalSampling: {}
