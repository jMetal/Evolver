# PAESDouble.yaml
#
# Parameter space for PAES (Pareto Archived Evolution Strategy) with double encoding.
#
# Non-configurable (hardcoded in BasePAES / DoublePAES):
#   populationSize = 1
#   offspringPopulationSize = 1
#   selection = RandomSelection (matingPoolSize = 1)
#   crossover = none (MutationOnlyVariation)

paesArchiveType:
  type: categorical
  globalSubParameters:
    paesArchiveSize:
      type: integer
      range: [10, 200]
  values:
    crowdingDistanceArchive: {}
    hypervolumeArchive: {}
    spatialSpreadDeviationArchive: {}

algorithmResult:
  type: categorical
  values:
    paesArchive: {}
    externalArchive:
      conditionalParameters:
        externalArchiveSize:
          type: integer
          range: [10, 200]
        archiveType:
          type: categorical
          values:
            crowdingDistanceArchive: {}
            unboundedArchive: {}

createInitialSolutions:
  type: categorical
  values:
    default: {}
    latinHypercubeSampling: {}
    scatterSearch: {}

mutation:
  type: categorical
  globalSubParameters:
    mutationProbabilityFactor:
      type: double
      range: [0.0, 2.0]
    mutationRepairStrategy:
      type: categorical
      values:
        random: {}
        round: {}
        bounds: {}
  values:
    uniform:
      conditionalParameters:
        uniformMutationPerturbation:
          type: double
          range: [0.0, 1.0]
    polynomial:
      conditionalParameters:
        polynomialMutationDistributionIndex:
          type: double
          range: [5.0, 400.0]
    linkedPolynomial:
      conditionalParameters:
        linkedPolynomialMutationDistributionIndex:
          type: double
          range: [5.0, 400.0]
    nonUniform:
      conditionalParameters:
        nonUniformMutationPerturbation:
          type: double
          range: [0.0, 1.0]
    levyFlight:
      conditionalParameters:
        levyFlightMutationBeta:
          type: double
          range: [1.0, 2.0]
        levyFlightMutationStepSize:
          type: double
          range: [0.01, 1.0]
    powerLaw:
      conditionalParameters:
        powerLawMutationDelta:
          type: double
          range: [0.1, 10.0]
