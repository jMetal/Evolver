# PAESDouble.yaml
#
# Parameter space for PAES (Pareto Archived Evolution Strategy) with double encoding.
#
# Non-configurable (hardcoded in BasePAES / DoublePAES):
#   populationSize = 1, offspringPopulationSize = 1
#   crossover = none (MutationOnlyVariation)
#   initial solution = a single random solution (RandomSolutionsCreation); other
#     strategies (Latin hypercube, scatter search) are population-diversity oriented
#     and meaningless for a single-solution (1+1) ES
#   PAES archive size (numberOfSolutionsToFind) is fixed and passed via the constructor,
#   analogous to populationSize in other algorithms (typical value: 100)

paesArchiveType:
  type: categorical
  values:
    crowdingDistanceArchive: {}
    hypervolumeArchive: {}
    spatialSpreadDeviationArchive: {}

algorithmResult:
  type: categorical
  values:
    paesArchive: {}
    externalArchive: {}

# Probability of mutating a randomly chosen archive member instead of the current
# solution, analogous to MOEA/D's neighborhoodSelectionProbability. A value of 0.0
# corresponds to classic PAES (always mutate the current solution).
archiveSelectionProbability:
  type: double
  range: [0.0, 1.0]

mutation:
  type: categorical
  globalSubParameters:
    mutationProbabilityFactor:
      type: double
      range: [0.0, 2.0]
    mutationRepairStrategy:
      type: categorical
      values:
        random: {}
        round: {}
        bounds: {}
  values:
    uniform:
      conditionalParameters:
        uniformMutationPerturbation:
          type: double
          range: [0.0, 1.0]
    polynomial:
      conditionalParameters:
        polynomialMutationDistributionIndex:
          type: double
          range: [5.0, 400.0]
    linkedPolynomial:
      conditionalParameters:
        linkedPolynomialMutationDistributionIndex:
          type: double
          range: [5.0, 400.0]
    nonUniform:
      conditionalParameters:
        nonUniformMutationPerturbation:
          type: double
          range: [0.0, 1.0]
    levyFlight:
      conditionalParameters:
        levyFlightMutationBeta:
          type: double
          range: [1.0, 2.0]
        levyFlightMutationStepSize:
          type: double
          range: [0.01, 1.0]
    powerLaw:
      conditionalParameters:
        powerLawMutationDelta:
          type: double
          range: [0.1, 10.0]
