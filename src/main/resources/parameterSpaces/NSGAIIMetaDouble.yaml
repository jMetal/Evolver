# Parameter space for the meta-level NSGA-II used by cli.runner's MetaAlgorithmRegistry to tune a
# base-level algorithm's parameters (flat [0,1]^n encoding). Same format/machinery as the
# base-level parameter spaces (e.g. NSGAIIDouble.yaml), but deliberately restricted: a
# meta-optimizer has no use for external archives or alternative solution-creation strategies, so
# those choices are narrowed to a single value while keeping the top-level parameter names that
# org.uma.evolver.algorithm.nsgaii.BaseNSGAII#build() requires to be present.

algorithmResult:
  type: categorical
  values:
    population: {}

createInitialSolutions:
  type: categorical
  values:
    default: {}

offspringPopulationSize:
  type: categorical
  values: [1, 2, 5, 10, 20, 50, 100, 200, 400]

variation:
  type: categorical
  values:
    crossoverAndMutationVariation:
      conditionalParameters:
        crossover:
          type: categorical
          globalSubParameters:
            crossoverProbability:
              type: double
              range: [0.0, 1.0]
            crossoverRepairStrategy:
              type: categorical
              values: [random, round, bounds]
          values:
            SBX:
              conditionalParameters:
                sbxDistributionIndex:
                  type: double
                  range: [5.0, 400.0]
            blxAlpha:
              conditionalParameters:
                blxAlphaCrossoverAlpha:
                  type: double
                  range: [0.0, 1.0]
            wholeArithmetic: {}

        mutation:
          type: categorical
          globalSubParameters:
            mutationProbabilityFactor:
              type: double
              range: [0.0, 2.0]
            mutationRepairStrategy:
              type: categorical
              values:
                random: {}
                round: {}
                bounds: {}
          values:
            uniform:
              conditionalParameters:
                uniformMutationPerturbation:
                  type: double
                  range: [0.0, 1.0]
            polynomial:
              conditionalParameters:
                polynomialMutationDistributionIndex:
                  type: double
                  range: [5.0, 400.0]

selection:
  type: categorical
  values:
    tournament:
      conditionalParameters:
        selectionTournamentSize:
          type: integer
          range: [2, 10]
