# PAESPermutation.yaml
#
# Parameter space for PAES (Pareto Archived Evolution Strategy) with permutation encoding.
#
# Non-configurable (hardcoded in BasePAES / PermutationPAES):
#   populationSize = 1, offspringPopulationSize = 1
#   crossover = none (MutationOnlyVariation)
#   initial solution = a single random solution (RandomSolutionsCreation)
#   PAES archive size (numberOfSolutionsToFind) fixed via constructor (typical: 100)

paesArchiveType:
  type: categorical
  values:
    crowdingDistanceArchive: {}
    spatialSpreadDeviationArchive: {}
    knnDistanceArchive:
      conditionalParameters:
        knnDistanceArchiveK:
          type: integer
          range: [1, 10]
    angleArchive: {}

algorithmResult:
  type: categorical
  values:
    paesArchive: {}
    externalArchive: {}

# Probability of mutating a randomly chosen archive member instead of the current solution.
archiveSelectionProbability:
  type: double
  range: [0.0, 1.0]

mutation:
  type: categorical
  globalSubParameters:
    mutationProbability:
      type: double
      range: [0.0, 1.0]
  values:
    swap: {}
    insert: {}
    scramble: {}
    inversion: {}
    simpleInversion: {}
    displacement: {}
