algorithmResult:
  type: categorical
  values:
    population: {}
    externalArchive:
      conditionalParameters:
        archiveType:
          type: categorical
          values:
            crowdingDistanceArchive: {}
            unboundedArchive: {}

createInitialSolutions:
  type: categorical
  values:
    default: {}
    latinHypercubeSampling: {}
    scatterSearch: {}
    sobol: {}
    cauchy: {}
    oppositionBased: {}

# The values of jMetal's AutoRVEA: below 10 the running time grows (the selection cost per
# generation hardly depends on the offspring size) without better results, and above 200 the
# results degrade.
offspringPopulationSize:
  type: categorical
  values: [10, 20, 50, 100, 150, 200]

selection:
  type: categorical
  values:
    random: {}
    tournament:
      conditionalParameters:
        selectionTournamentSize:
          type: integer
          range: [2, 10]

# The variant of the RVEA family, as in jMetal's AutoRVEA: RVEA, RVEA* or iRVEA.
replacement:
  type: categorical
  globalSubParameters:
    alpha:
      type: double
      range: [0.5, 10.0]
    fr:
      type: double
      range: [0.01, 1.0]
  values:
    rvea: {}
    rveaStar: {}
    iRVEA:
      conditionalParameters:
        numberOfSubregions:
          type: integer
          range: [10, 100]
        lateStageFraction:
          type: double
          range: [0.5, 1.0]
        epsilonKappa:
          type: double
          range: [0.01, 0.2]

variation:
  type: categorical
  values:
    crossoverAndMutationVariation:
      conditionalParameters:
        crossover:
          type: categorical
          globalSubParameters:
            crossoverProbability:
              type: double
              range: [0.0, 1.0]
            crossoverRepairStrategy:
              type: categorical
              values: [random, round, bounds]
          values:
            SBX:
              conditionalParameters:
                sbxDistributionIndex:
                  type: double
                  range: [5.0, 400.0]
            blxAlpha:
              conditionalParameters:
                blxAlphaCrossoverAlpha:
                  type: double
                  range: [0.0, 1.0]
            wholeArithmetic: {}
            blxAlphaBeta:
              conditionalParameters:
                blxAlphaBetaCrossoverBeta:
                  type: double
                  range: [0.0, 1.0]
                blxAlphaBetaCrossoverAlpha:
                  type: double
                  range: [0.0, 1.0]
            arithmetic: {}
            laplace:
              conditionalParameters:
                laplaceCrossoverScale:
                  type: double
                  range: [0.1, 0.5]
            fuzzyRecombination:
              conditionalParameters:
                fuzzyRecombinationCrossoverAlpha:
                  type: double
                  range: [0.0001, 1.0]
            PCX:
              conditionalParameters:
                pcxCrossoverZeta:
                  type: double
                  range: [0.0, 1.0]
                pcxCrossoverEta:
                  type: double
                  range: [0.0, 1.0]
            UNDC:
              conditionalParameters:
                undcCrossoverZeta:
                  type: double
                  range: [0.1, 1.0]
                undcCrossoverEta:
                  type: double
                  range: [0.1, 0.5]

        mutation:
          type: categorical
          globalSubParameters:
            mutationProbabilityFactor:
              type: double
              range: [0.0, 2.0]
            mutationRepairStrategy:
              type: categorical
              values:
                random: {}
                round: {}
                bounds: {}
          values:
            uniform:
              conditionalParameters:
                uniformMutationPerturbation:
                  type: double
                  range: [0.0, 1.0]
            polynomial:
              conditionalParameters:
                polynomialMutationDistributionIndex:
                  type: double
                  range: [5.0, 400.0]
            linkedPolynomial:
              conditionalParameters:
                linkedPolynomialMutationDistributionIndex:
                  type: double
                  range: [5.0, 400.0]
            nonUniform:
              conditionalParameters:
                nonUniformMutationPerturbation:
                  type: double
                  range: [0.0, 1.0]
            levyFlight:
              conditionalParameters:
                levyFlightMutationBeta:
                  type: double
                  range: [1.0001, 2.0]
                levyFlightMutationStepSize:
                  type: double
                  range: [0.01, 1.0]
            powerLaw:
              conditionalParameters:
                powerLawMutationDelta:
                  type: double
                  range: [0.1, 10.0]
