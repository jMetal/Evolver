# The meta-optimizer of tutorial E4 (TutorialQuickNSGAIIMetaSearch.yaml) starting from the
# configurations that a language model proposed in tutorial E21 (docs/tutorials/llms_in_evolver.rst):
# they are the first solutions of its initial population, and the rest are random. Experimental.
algorithm: NSGA-II
encoding: flat

metaMaxEvaluations: 500
metaPopulationSize: 50
numberOfCores: 8

crossover: SBX
crossoverProbability: 0.9
crossoverRepairStrategy: bounds
sbxDistributionIndex: 20.0
mutation: polynomial
mutationProbabilityFactor: 1.0
mutationRepairStrategy: bounds
polynomialMutationDistributionIndex: 20.0
selection: tournament
selectionTournamentSize: 2

initialConfigurations: results/tutorial-llm/configurations.txt
