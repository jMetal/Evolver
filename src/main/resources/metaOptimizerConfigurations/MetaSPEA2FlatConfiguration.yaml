# Meta configuration of SPEA2 (flat encoding)
#
# The operator fields below are parsed against SPEA2MetaDouble.yaml. What defines SPEA2 (strength
# ranking, k-nearest-neighbour density estimator and its sequential replacement), the offspring
# population size (always metaPopulationSize) and the result (always the final population) are fixed
# by MetaAlgorithmRegistry. The operators are set as for NSGA-II; the values below are SPEA2's usual
# ones, which the registry also uses for any of them that is left out.

algorithm: SPEA2
encoding: flat

metaMaxEvaluations: 2000
metaPopulationSize: 50
numberOfCores: 8

crossover: SBX
crossoverProbability: 0.9
crossoverRepairStrategy: bounds
sbxDistributionIndex: 20.0
mutation: polynomial
mutationProbabilityFactor: 1.0
mutationRepairStrategy: bounds
polynomialMutationDistributionIndex: 20.0
selection: tournament
selectionTournamentSize: 2
# knnNeighborhoodSize: 1           # optional; defaults to 1
# knnNormalizeObjectives: false    # optional; defaults to false
