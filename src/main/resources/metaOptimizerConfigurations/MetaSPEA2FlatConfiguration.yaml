# Meta configuration of SPEA2 (flat encoding)
#
# MetaSPEA2Builder hardcodes its own operators (SBX crossover, polynomial mutation, strength
# ranking, KNN density estimator, tournament selection) — only populationSize/maxEvaluations/
# numberOfCores below and, optionally, mutationProbabilityFactor are configurable. The offspring
# population size always equals metaPopulationSize. Same recipe as
# org.uma.evolver.example.training.dtlz.SPEA2OptimizingNSGAIIForProblemDTLZ3.

algorithm: SPEA2
encoding: flat

metaMaxEvaluations: 2000
metaPopulationSize: 100
numberOfCores: 8

# mutationProbabilityFactor: 1.0   # optional; defaults to 1.0
