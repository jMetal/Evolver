# Meta configuration of AGE-MOEA with tree (derivation tree) encoding
#
# Same operator fields as MetaNSGAIITreeConfiguration.yaml, plus AGE-MOEA's environmental
# selection variant (agemoea or agemoea2), parsed against AGEMOEAMetaTree.yaml.

algorithm: AGE-MOEA
encoding: tree

metaMaxEvaluations: 2000
metaPopulationSize: 50
numberOfCores: 8

agemoeaVariant: agemoea
crossoverProbability: 0.9
mutationProbability: 1.0
mutationDistributionIndex: 20.0
selection: tournament
selectionTournamentSize: 2
