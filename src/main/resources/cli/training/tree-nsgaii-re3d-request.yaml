# Example TrainingRequest, equivalent to the values in
# org.uma.evolver.example.training.re3d.TreeNSGAIIOptimizingNSGAIIForBenchmarkRE3D
#
# Exercises the tree encoding: the meta-optimizer evolves derivation trees of the base-level
# grammar with SubtreeCrossover/TreeMutation (see MetaNSGAIITreeConfiguration.yaml).

baseLevel: Re3dNSGAIITreeBaseLevel.yaml
metaSearch: MetaNSGAIITreeConfiguration.yaml
outputDirectory: results/tree-nsgaii/RE3D
writeFrequency: 100
statusFrequency: 100
# frontPlotFrequency: 100   # optional; uncomment for a live Pareto front plot (not headless)
