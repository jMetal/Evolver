# Example TrainingRequest exercising AGE-MOEA as meta-optimizer
# (org.uma.jmetal.component.algorithm.EvolutionaryAlgorithm, built directly on DoubleAGEMOEA), on
# the same base level as nsgaii-zdt4-request.yaml.

baseLevel: Zdt4NSGAIIBaseLevel.yaml
