# Example TrainingRequest exercising the asynchronous multi-threaded meta-optimizer
# (org.uma.jmetal.parallel.asynchronous.algorithm.impl.AsynchronousMultiThreadedNSGAII, built via
# MetaAsyncNSGAIIBuilder), equivalent in spirit to
# org.uma.evolver.example.training.AsyncNSGAIIOptimizingNSGAIIForBenchmarkRE3D but for a single
# training problem. See MetaAsyncNSGAIIFlatConfiguration.yaml: it only declares the
# crossover/mutation operators (selection and replacement are hardcoded inside
# AsynchronousMultiThreadedNSGAII itself). Shares Zdt4NSGAIIBaseLevel.yaml with
# nsgaii-zdt4-request.yaml — only the meta-optimizer engine differs between the two requests.
#
# Note: TrainingRunnerMain calls System.exit(0) after this kind of run finishes, because the
# async algorithm's worker thread pool does not shut down on its own.

baseLevel: Zdt4NSGAIIBaseLevel.yaml
metaSearch: MetaAsyncNSGAIIFlatConfiguration.yaml
outputDirectory: results/async-nsgaii/ZDT4
writeFrequency: 100
statusFrequency: 100
frontPlotFrequency: 100   # optional; uncomment for a live Pareto front plot (not headless)
