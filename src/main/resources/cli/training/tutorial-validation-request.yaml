# Training request of tutorial E8 (docs/tutorials/validating_a_configuration.rst): NSGA-II tuned
# for the bi-objective WFG problems (TutorialWfg2DBaseLevel.yaml), with the asynchronous NSGA-II of
# tutorial E6 as meta-optimizer (2000 configurations). Copy it to a working directory before
